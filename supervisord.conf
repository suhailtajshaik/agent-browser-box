[supervisord]
nodaemon=true
logfile=/home/sandboxuser/supervisord.log
pidfile=/home/sandboxuser/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24
autorestart=true
priority=1
stdout_logfile=/home/sandboxuser/xvfb.log
stderr_logfile=/home/sandboxuser/xvfb_err.log

[program:chromium]
; Call the real Chromium binary directly — bypasses the Debian wrapper which
; injects --disable-background-networking and other flags that break the browser.
; --disable-dev-shm-usage is added explicitly here to prevent shm crashes
; (the same reason we use Debian over Ubuntu).
command=/usr/lib/chromium/chromium
    --remote-debugging-port=9222
    --remote-debugging-address=0.0.0.0
    --disable-gpu
    --disable-dev-shm-usage
    --start-maximized
    --no-first-run
    --disable-session-crashed-bubble
    --disable-infobars
    --user-data-dir=/home/sandboxuser/chrome-profile
environment=DISPLAY=":99",HOME="/home/sandboxuser"
autorestart=true
startretries=99999
startsecs=3
priority=3
stdout_logfile=/home/sandboxuser/chromium.log
stderr_logfile=/home/sandboxuser/chromium_err.log

[program:openbox]
command=openbox --sm-disable
environment=DISPLAY=":99",HOME="/home/sandboxuser"
autorestart=true
priority=2
stdout_logfile=/home/sandboxuser/openbox.log
stderr_logfile=/home/sandboxuser/openbox_err.log

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -rfbport 5900
autorestart=true
priority=4
stdout_logfile=/home/sandboxuser/x11vnc.log
stderr_logfile=/home/sandboxuser/x11vnc_err.log

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=5
stdout_logfile=/home/sandboxuser/novnc.log
stderr_logfile=/home/sandboxuser/novnc_err.log
